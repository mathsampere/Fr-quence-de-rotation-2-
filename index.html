
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcul de fréquence de rotation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #172554, #2563eb);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            width: 350px;
            max-width: calc(100% - 80px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            text-align: center;
        }

        h1 {
            color: #1e3a8a;
            font-size: 25px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            text-align: left;
            font-weight: bold;
            color: #334155;
            margin-bottom: 8px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            margin-bottom: 20px;
            background: white;
        }

        input:focus, select:focus {
            border-color: #2563eb;
            outline: none;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #1e40af;
            transform: scale(1.03);
        }

        #resultat {
            margin-top: 25px;
            padding: 15px;
            border-radius: 10px;
            background: #eff6ff;
            color: #1e40af;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>⚙️ Fréquence de rotation</h1>

        <label for="materiau">Choisir un matériau</label>

        <select id="materiau">
            <option value="">-- Sélectionner --</option>
            <option value="acier">Acier</option>
            <option value="fonte">Fonte</option>
            <option value="bronze">Bronze</option>
            <option value="laiton">Laiton</option>
        </select>

        <label for="diametre">Diamètre en mm</label>

        <input type="number" id="diametre"
               placeholder="Ex : 20" min="0" step="any">

        <button onclick="calculer()">Calculer</button>

        <h2 id="resultat"></h2>

    </div>

    <script>
        function calculer() {

            let m = document.getElementById("materiau").value;
            let d = parseFloat(document.getElementById("diametre").value);

            let v;

            if (m == "acier" || m == "fonte") {
                v = 22;
            }
            else if (m == "bronze") {
                v = 50;
            }
            else if (m == "laiton") {
                v = 60;
            }
            else {
                document.getElementById("resultat").innerHTML =
                    "⚠️ Veuillez choisir un matériau";
                return;
            }

            if (isNaN(d) || d <= 0) {
                document.getElementById("resultat").innerHTML =
                    "⚠️ Diamètre invalide";
                return;
            }

            let f = 1000 * v / (3.14 * d);

            document.getElementById("resultat").innerHTML =
                "Résultat :<br><strong>" +
                Math.round(f) + " tr/min</strong>";
        }
    </script>

</body>
</html>
